<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>点金课表</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#151b23; --sub:#6b7684; --faint:#9aa4b1;
    --line:#e7eaef; --gold:#b8860b; --gold-soft:#fdf6e3; --gold-line:#ecd9a8;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    font-size:15px; line-height:1.5;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  /* ---------- 顶部 ---------- */
  header{padding:22px 0 14px}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,#e2bf5f,#b8860b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);position:relative;flex:0 0 auto}
  .mark::after{content:"";position:absolute;left:7px;top:7px;width:12px;height:12px;border-radius:50%;
    border:2px solid rgba(255,255,255,.85)}
  h1{font-size:20px;font-weight:700;letter-spacing:.5px;margin:0}
  .sub{margin:7px 0 0;color:var(--sub);font-size:12.5px}
  .sub b{color:var(--gold);font-weight:600}

  /* ---------- 搜索 ---------- */
  .search{position:relative;margin:4px 0 12px}
  .search input{
    width:100%;height:46px;border:1px solid var(--line);border-radius:13px;background:var(--card);
    padding:0 40px 0 40px;font-size:15px;color:var(--ink);outline:none;
    box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s;
    font-family:inherit;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--gold-line);box-shadow:0 0 0 3px rgba(184,134,11,.09)}
  .search .icon{position:absolute;left:14px;top:14px;width:18px;height:18px;color:var(--faint)}
  .search .clr{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:9px;
    background:transparent;color:var(--faint);font-size:18px;line-height:1;cursor:pointer;display:none}
  .search .clr.show{display:block}

  /* ---------- 老师胶囊 ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:11px;padding:8px 12px;font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:.16s;box-shadow:0 1px 1px rgba(16,24,40,.03);
    font-family:inherit;
  }
  .chip .sj{font-size:11px;color:var(--faint);border-left:1px solid var(--line);padding-left:7px}
  .chip:hover{border-color:var(--gold-line)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip.on .sj{color:rgba(255,255,255,.55);border-color:rgba(255,255,255,.22)}

  /* ---------- 范围切换 ---------- */
  .tabs{display:inline-flex;background:#eceef2;border-radius:11px;padding:3px;margin-bottom:6px}
  .tabs button{
    border:0;background:transparent;color:var(--sub);font-size:13.5px;padding:7px 16px;
    border-radius:9px;cursor:pointer;font-family:inherit;transition:.16s;
  }
  .tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
  .summary{color:var(--faint);font-size:12.5px;margin:10px 2px 14px}
  .summary b{color:var(--sub);font-weight:600}
  .summary a{color:var(--gold);text-decoration:none;margin-left:8px;
    border-bottom:1px dashed var(--gold-line);padding-bottom:1px}

  /* ---------- 日期卡片 ---------- */
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;
    box-shadow:var(--shadow);overflow:hidden}
  .day.today{border-color:var(--gold-line);box-shadow:0 0 0 3px rgba(184,134,11,.07),var(--shadow)}
  .day.future-today{position:relative}
  .dayhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);
    background:#fbfbfc}
  .day.today .dayhead{background:var(--gold-soft)}
  .dayhead .d{font-weight:700;font-size:15px;letter-spacing:.2px}
  .dayhead .w{color:var(--sub);font-size:12.5px}
  .badge{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:999px;
    background:var(--gold);color:#fff;font-weight:600;letter-spacing:.5px}
  .dayhead .n{margin-left:auto;color:var(--faint);font-size:12px}
  .day.today .dayhead .n{margin-left:0}

  ul.cls{list-style:none;margin:0;padding:4px 0}
  ul.cls li{display:flex;align-items:center;gap:12px;padding:10px 14px}
  ul.cls li + li{border-top:1px dashed #eef0f4}
  .t{flex:0 0 auto;font-size:12.5px;color:var(--gold);background:var(--gold-soft);
    border:1px solid var(--gold-line);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums;
    letter-spacing:.2px;min-width:104px;text-align:center}
  .c{font-size:15px;color:var(--ink);word-break:break-all}
  .past .head, .past{opacity:.55}

  /* ---------- 空状态 / 底 ---------- */
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:30px 18px;
    text-align:center;color:var(--sub);font-size:14px}
  .empty .big{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}
  footer{margin-top:22px;color:var(--faint);font-size:11.5px;line-height:1.7;text-align:center}
  footer a{color:var(--faint)}
  /* ---------- 刷新按钮 ---------- */
  .brand .rf{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
    border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold);
    border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
    transition:.16s;flex:0 0 auto;
  }
  .brand .rf:hover{border-color:var(--gold)}
  .brand .rf:active{transform:scale(.96)}
  .brand .rf svg{width:14px;height:14px;display:block}
  .brand .rf.busy{opacity:.72;cursor:default}
  .brand .rf.busy svg{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);opacity:0;pointer-events:none;z-index:99;
    background:rgba(20,26,34,.93);color:#fff;font-size:13px;line-height:1.45;
    padding:10px 16px;border-radius:11px;max-width:calc(100% - 40px);text-align:center;
    transition:opacity .24s,transform .24s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 今天已上完的课 ---------- */
  ul.cls li.done .t{color:var(--faint);background:transparent;border-color:var(--line)}
  ul.cls li.done .c{color:var(--faint)}
  .done-tag{flex:0 0 auto;margin-left:auto;font-size:10.5px;color:var(--faint);
    border:1px solid var(--line);border-radius:6px;padding:1px 5px;letter-spacing:.3px}

  .hide{display:none !important}

  @media (max-width:380px){
    .t{min-width:92px;font-size:12px;padding:3px 6px}
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1318; --card:#161b22; --ink:#e8edf3; --sub:#9aa7b6; --faint:#6f7d8c;
      --line:#252c36; --gold:#d8ab3c; --gold-soft:#1f1a0e; --gold-line:#4a3a15;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    }
    .tabs{background:#1b2129}
    .dayhead{background:#191f27}
    .day.today .dayhead{background:var(--gold-soft)}
    .day.today{box-shadow:0 0 0 3px rgba(216,171,60,.1), var(--shadow)}
    ul.cls li + li{border-top-color:#232a33}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark"></div><h1>点金课表</h1>
      <button class="rf" id="rf" title="重新拉取数据，并按当前时间重算课表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path>
        </svg><span>刷新</span>
      </button>
    </div>
    <p class="sub">选个名字就能看自己的课 · 数据更新于 <b id="meta">—</b></p>
  </header>

  <div class="search">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input id="q" type="search" placeholder="搜名字，也可搜科目：语文 / 数学" autocomplete="off">
    <button class="clr" id="clr" aria-label="清空">×</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="tabs" id="tabs">
    <button data-scope="7" class="on">未来 7 天</button>
    <button data-scope="all">全部课表</button>
  </div>

  <p class="summary" id="summary"></p>
  <main id="view"></main>

  <footer>
    <div id="foot"></div>
    数据来自金山文档，每天自动整理 · 仅供校内查看
  </footer>
</div>

<script>
/* 主逻辑：由页面底部的引导脚本在数据加载完成后调用 */
window.__djBoot = function(){
  "use strict";

  var JSON_URL = "data/all_teachers.json";
  var JS_URL   = "data/all_teachers.js";

  var view      = document.getElementById("view");
  var chips     = document.getElementById("chips");
  var qBox      = document.getElementById("q");
  var clr       = document.getElementById("clr");
  var summaryEl = document.getElementById("summary");
  var tabs      = document.getElementById("tabs");
  var rfBtn     = document.getElementById("rf");
  var metaEl    = document.getElementById("meta");
  var footEl    = document.getElementById("foot");

  var data = window.SCHEDULE_DATA;
  if (!data || !data.teachers) {
    view.innerHTML = '<div class="empty"><span class="big">还没有课表数据</span>' +
      '先在电脑上运行 <code>python 生成全员课表.py</code>，' +
      '生成 data/all_teachers.js 之后刷新本页。</div>';
    return;
  }

  /* ---------- 日期 / 时间工具 ---------- */
  function pad2(n){ return ("0" + n).slice(-2); }
  function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function midnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  var TODAY, TODAY_ISO, NOWMIN;
  function recomputeNow(){
    var d = new Date();
    NOWMIN = d.getHours() * 60 + d.getMinutes();
    TODAY = midnight(d);
    TODAY_ISO = TODAY.getFullYear() + "-" + pad2(TODAY.getMonth() + 1) + "-" + pad2(TODAY.getDate());
  }
  recomputeNow();

  function dayDiff(iso){ return Math.round((parseISO(iso) - TODAY) / 86400000); }

  /* 从 "8:00-10:00" 取结束时间（分钟）；只有 "9:00" 这种就取它本身 */
  function endMinutes(t){
    var s = String(t || "");
    var m = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})\s*[-－~—至]\s*(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (m) return (+m[3]) * 60 + (+m[4]);
    m = s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if (m) return (+m[1]) * 60 + (+m[2]);
    return null;
  }
  /* 只有「今天、且结束时间已过」才算已上 */
  function isDone(day, c){
    if (dayDiff(day.date) !== 0) return false;
    var e = endMinutes(c.time);
    return e !== null && e <= NOWMIN;
  }
  function clock(){
    var d = new Date();
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }

  /* ---------- 状态 ---------- */
  var names = Object.keys(data.teachers);
  var store = {};
  try { store = JSON.parse(localStorage.getItem("dj_teacher") || "{}") || {}; } catch(e){ store = {}; }
  var current = store.name && data.teachers[store.name] ? store.name : names[0];
  var scope = store.scope === "all" ? "all" : "7";
  var keyword = "";
  var lastRefresh = "";

  // 支持分享链接：index.html?name=段锋杰&scope=all
  try {
    var qs = new URLSearchParams(location.search);
    var qn = qs.get("name") || qs.get("t");
    if (qn && data.teachers[qn]) current = qn;
    if (qs.get("scope") === "all") scope = "all";
  } catch(e){}

  function save(){
    try { localStorage.setItem("dj_teacher", JSON.stringify({ name: current, scope: scope })); } catch(e){}
  }

  /* ---------- 顶部信息 ---------- */
  function paintMeta(){
    metaEl.textContent = data.generatedAt || "—";
    footEl.innerHTML =
      "共 " + data.teacherCount + " 位老师、" + data.lessonCount + " 节课 · 数据生成于 " +
      (data.generatedAt || "—") +
      (lastRefresh ? " · 本页 " + lastRefresh + " 刷新" : "") + "<br>";
  }

  /* ---------- 老师胶囊 ---------- */
  function renderChips(){
    chips.innerHTML = "";
    var list = names.filter(function(n){
      if (!keyword) return true;
      var info = data.teachers[n] || {};
      return n.indexOf(keyword) >= 0 || (info.sheet || "").indexOf(keyword) >= 0;
    });
    if (!list.length) {
      chips.innerHTML = '<div class="empty" style="width:100%;padding:16px">没找到「' +
        keyword + '」对应的老师</div>';
      return;
    }
    list.forEach(function(n){
      var b = document.createElement("button");
      b.className = "chip" + (n === current ? " on" : "");
      b.innerHTML = '<span>' + n + '</span><span class="sj">' +
        (data.teachers[n].sheet || "") + "</span>";
      b.onclick = function(){
        current = n;
        save();
        renderChips();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      chips.appendChild(b);
    });
  }

  /* ---------- 课表 ---------- */
  function render(){
    var info = data.teachers[current];
    if (!info) { current = names[0]; info = data.teachers[current]; }
    var days = (info.days || []).slice();
    var list = scope === "7" ? days.filter(function(d){
      var k = dayDiff(d.date); return k >= 0 && k <= 6;
    }) : days;

    var total = list.reduce(function(a, d){ return a + d.classes.length; }, 0);
    var allTotal = days.reduce(function(a, d){ return a + d.classes.length; }, 0);

    // 今天上了几节 / 还剩几节
    var todayDay = null;
    for (var i = 0; i < days.length; i++) if (days[i].date === TODAY_ISO) { todayDay = days[i]; break; }
    var todayDone = 0;
    if (todayDay) {
      todayDay.classes.forEach(function(c){ if (isDone(todayDay, c)) todayDone++; });
    }
    var todayTxt = todayDay
      ? ' · 今天 <b>' + todayDone + '/' + todayDay.classes.length + '</b> 节已上'
      : ' · 今天没课';

    var hasToday = !!todayDay;
    var jump = (scope === "all" && hasToday) ? '<a href="#today-card">跳到今天</a>' : "";
    summaryEl.innerHTML = scope === "7"
      ? "<b>" + current + "</b> 未来 7 天 · " + list.length + " 天有课 · 共 <b>" + total + "</b> 节课" + todayTxt
      : "<b>" + current + "</b> 全学期 · " + days.length + " 天有课 · 共 <b>" + allTotal + "</b> 节课" + todayTxt + jump;

    if (!list.length) {
      view.innerHTML = '<div class="empty"><span class="big">这 7 天没有排课</span>' +
        '可以切到「全部课表」看看整个学期的安排。</div>';
      return;
    }

    var html = "";
    list.forEach(function(d){
      var k = dayDiff(d.date);
      var cls = "day";
      if (k === 0) cls += " today";
      if (k < 0) cls += " past";
      var badge = "";
      if (k === 0) badge = '<span class="badge">今天</span>';
      else if (k === 1) badge = '<span class="badge" style="background:#8a94a3">明天</span>';
      html += '<div class="' + cls + '"' + (k === 0 ? ' id="today-card"' : '') + '>' +
        '<div class="dayhead"><span class="d">' + d.dateLabel + '</span>' +
        '<span class="w">' + d.weekday + '</span>' + badge +
        '<span class="n">' + d.classes.length + ' 节</span>' +
        "</div><ul class=\"cls\">";
      d.classes.forEach(function(c){
        var done = isDone(d, c);
        html += '<li class="' + (done ? "done" : "") + '">' +
          '<span class="t">' + c.time + '</span>' +
          '<span class="c">' + c.course + '</span>' +
          (done ? '<span class="done-tag">已上</span>' : "") + '</li>';
      });
      html += "</ul></div>";
    });
    view.innerHTML = html;
  }

  function applyData(){
    names = Object.keys(data.teachers);
    if (!data.teachers[current]) current = names[0];
    paintMeta();
    renderChips();
    render();
  }

  /* ---------- 提示条 ---------- */
  var toastEl = null, toastTimer = null;
  function toast(msg){
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.className = "toast";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 3200);
  }

  /* ---------- 刷新：重新拉数据 + 按当前时间重算 ---------- */
  var refreshing = false;
  function setBusy(on){
    refreshing = on;
    rfBtn.classList.toggle("busy", on);
    rfBtn.disabled = on;
    rfBtn.querySelector("span").textContent = on ? "更新中" : "刷新";
  }

  function fetchJSON(url){
    return fetch(url, { cache: "no-store" }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* 兜底：重新插入 <script>，适用于 file:// 双击打开（fetch 会被浏览器拦） */
  function loadScriptData(url, ms){
    return new Promise(function(resolve, reject){
      var el = document.createElement("script");
      var settled = false;
      var timer = setTimeout(function(){
        if (settled) return; settled = true; el.remove();
        reject(new Error("加载超时"));
      }, ms || 8000);
      el.src = url;
      el.onload = function(){
        if (settled) return; settled = true; clearTimeout(timer);
        if (window.SCHEDULE_DATA && window.SCHEDULE_DATA.teachers) resolve(window.SCHEDULE_DATA);
        else reject(new Error("数据为空"));
      };
      el.onerror = function(){
        if (settled) return; settled = true; clearTimeout(timer);
        reject(new Error("文件加载失败"));
      };
      document.head.appendChild(el);
    });
  }

  /* 拉最新数据：线上走 JSON（体积小），本地双击回退到重新注入 js */
  function loadFresh(){
    var stamp = Date.now();
    return (location.protocol === "file:")
      ? loadScriptData(JS_URL + "?v=" + stamp)
      : fetchJSON(JSON_URL + "?v=" + stamp).catch(function(){
          return loadScriptData(JS_URL + "?v=" + stamp);
        });
  }

  /* 换上新的数据，并按「现在」重算；返回数据是否有变化 */
  function applyFresh(fresh, before){
    if (!fresh || !fresh.teachers) throw new Error("数据格式不对");
    data = fresh;
    recomputeNow();          // 关键：按「现在」重新算今天
    lastRefresh = clock();
    applyData();
    return (fresh.generatedAt || "") !== (before || "");
  }

  function refresh(){
    if (refreshing) return;
    setBusy(true);
    var before = data.generatedAt || "";
    loadFresh().then(function(fresh){
      var changed = applyFresh(fresh, before);
      toast(changed
        ? "已更新到 " + (data.generatedAt || "最新") + " 的数据 · " + lastRefresh
        : "已刷新 · " + lastRefresh + "（数据没变，生成于 " + (data.generatedAt || "—") + "）");
    }).catch(function(err){
      recomputeNow();          // 拿不到新数据，也至少按当前时间重算一遍
      applyData();
      toast("拉取失败：" + err.message + "，已按当前时间重算课表");
    }).then(function(){
      setBusy(false);
    });
  }
  rfBtn.addEventListener("click", refresh);

  /* ---------- 事件 ---------- */
  qBox.addEventListener("input", function(){
    keyword = this.value.trim();
    clr.className = "clr" + (keyword ? " show" : "");
    renderChips();
  });
  clr.onclick = function(){
    qBox.value = ""; keyword = ""; clr.className = "clr";
    renderChips(); qBox.focus();
  };
  tabs.addEventListener("click", function(e){
    var t = e.target.closest("button");
    if (!t) return;
    scope = t.getAttribute("data-scope");
    [].forEach.call(tabs.children, function(b){ b.classList.toggle("on", b === t); });
    save(); render();
  });

  /* 页面一直开着：跨天或跨过下课时间，自动重算一次 */
  var guard = setInterval(function(){
    var d = new Date();
    var iso = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    if (iso !== TODAY_ISO) {
      recomputeNow(); render();
      toast("已经跨到 " + iso + "，课表已按新的一天重算");
      return;
    }
    var mins = d.getHours() * 60 + d.getMinutes();
    if (mins !== NOWMIN) {
      var t = null;
      var info = data.teachers[current];
      if (info) {
        for (var i = 0; i < info.days.length; i++) {
          var day = info.days[i];
          if (day.date !== TODAY_ISO) continue;
          for (var j = 0; j < day.classes.length; j++) {
            var e = endMinutes(day.classes[j].time);
            if (e !== null && e > NOWMIN && e <= mins) { t = e; break; }
          }
          break;
        }
      }
      NOWMIN = mins;
      if (t !== null) render();
    }
  }, 60000);

  /* ---------- 初始化 ---------- */
  [].forEach.call(tabs.children, function(b){
    b.classList.toggle("on", b.getAttribute("data-scope") === scope);
  });
  applyData();

  /* ---------- 自动同步：数据被更新后页面自己跟上 ---------- */
  function checkVersion(){
    if (document.hidden || refreshing) return;
    if (location.protocol === "file:") return;   // 本地双击打开，没有"云端更新"这回事
    var VER_URL = "data/version.json";
    if (!window.fetch) return;
    fetch(VER_URL + "?_=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        if (!v || !v.generatedAt) return;
        if (v.generatedAt === (data.generatedAt || "")) return;
        autoSync(v.generatedAt);
      })
      .catch(function(){ /* file:// 或离线，忽略 */ });
  }

  function autoSync(expected){
    if (refreshing) return;
    refreshing = true;
    var before = data.generatedAt || "";
    loadFresh().then(function(fresh){
      if (!fresh || !fresh.teachers) throw new Error("数据格式不对");
      if ((fresh.generatedAt || "") !== before) {
        applyFresh(fresh, before);
        toast("课表已自动更新 · " + (fresh.generatedAt || expected));
      }
    }).catch(function(){
      /* 静默失败，等下次轮询 */
    }).then(function(){ refreshing = false; });
  }

  setInterval(checkVersion, 5 * 60 * 1000);          // 每 5 分钟查一次版本（只拉几十字节）
  setTimeout(checkVersion, 8000);                     // 首屏可能命中缓存，8 秒后补一次
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) checkVersion();             // 切回前台立刻校验
  });
};

/* ---------- 引导：带版本号加载数据，再启动主逻辑 ---------- */
(function(){
  function p2(n){ return ("0" + n).slice(-2); }
  var d = new Date();
  var key = "" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate());   // 每天一个新版本号
  var el = document.createElement("script");
  el.src = "data/all_teachers.js?v=" + key;
  el.onload = function(){
    if (typeof window.__djBoot === "function") window.__djBoot();
  };
  el.onerror = function(){
    var v = document.getElementById("view");
    if (v) {
      v.innerHTML = '<div class="empty"><span class="big">课表数据加载失败</span>' +
        '检查 <code>data/all_teachers.js</code> 是否存在，路径必须完全一致。</div>';
    }
  };
  document.head.appendChild(el);
})();
</script>
</body>
